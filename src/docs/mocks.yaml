paths:
  /api/mocks/users:
    get:
      summary: generar mocks de usuarios (sin persistir)
      tags:
        - Mocks
      parameters:
        - name: count
          in: query
          required: false
          description: cantidad de usuarios a generar (entero entre 1 y 100, default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: mocks generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockUsersResponse"
        "400":
          description: cantidad invalida (0, negativa, mayor a 100 o no numerica)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: generar y persistir mocks de usuarios
      tags:
        - Mocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockCountInput"
      responses:
        "201":
          description: mocks persistidos correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockUsersResponse"
        "400":
          description: cantidad invalida (0, negativa, mayor a 100 o no numerica)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

