services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGO_URI=mongodb://db:27017/soloducha
      - JWT_SECRET=${JWT_SECRET:-devSecretChangeMe}
    depends_on:
      - db
  db:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
